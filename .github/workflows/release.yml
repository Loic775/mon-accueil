# À chaque envoi sur la branche main : compile l'APK signé et le publie dans la Release « latest ».
# Lien direct et stable :
#   https://github.com/<pseudo>/<repo>/releases/download/latest/MonAccueil.apk
name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tout l'historique : le numéro de version = nombre de commits

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Récupérer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Le secret KEYSTORE_BASE64 est manquant (voir GITHUB.md, étape 5)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mon-accueil.jks"

      - name: Tests et compilation
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/mon-accueil.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk MonAccueil.apk

      - name: Publier dans la Release « latest »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(git rev-list --count HEAD)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MonAccueil.apk \
            --title "Mon Accueil 1.0.$VERSION" \
            --notes "Version 1.0.$VERSION — commit ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Capture du tableau de bord
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture
          path: app/build/captures/
          if-no-files-found: ignore
